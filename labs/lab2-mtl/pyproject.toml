[project]
name = "ecgmtl"
version = "0.1.0"
description = "Multi-task ECG analysis on PTB-XL: diagnosis, rhythm, age"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5,<2.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "wfdb>=4.1",
]

[project.scripts]
ecgmtl = "ecgmtl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecgmtl"]

[dependency-groups]
dev = ["mypy>=1.10", "pytest>=8.0", "types-PyYAML>=6.0", "pandas-stubs>=2.2"]

# Same PyTorch build as the neighbouring tts project: CUDA 12.1 wheels run on any
# driver >= 525, including 12.8, and are known to install on this hardware.
[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.mypy]
files = ["src/ecgmtl"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
