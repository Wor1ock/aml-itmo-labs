[project]
name = "ecgmtl"
version = "0.1.0"
description = "Multi-task ECG analysis on PTB-XL: diagnosis, rhythm, age"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "wfdb>=4.1",
]

[project.scripts]
ecgmtl = "ecgmtl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecgmtl"]

[dependency-groups]
dev = ["mypy>=1.10", "pytest>=8.0", "types-PyYAML>=6.0", "pandas-stubs>=2.2"]

[tool.mypy]
files = ["src/ecgmtl"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = ["ecgmtl.viz.*", "ecgmtl.report.*", "ecgmtl.analysis.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
