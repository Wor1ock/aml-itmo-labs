[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusion-slu"
version = "0.2.0"
description = "Audio-text cross-attention fusion for intent classification on Fluent Speech Commands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "kaggle>=1.7.4.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "six>=1.17.0",
    "types-PyYAML",
]

[tool.uv]
package = true

# CPU-only torch on linux keeps the docker image small.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/fusion_slu"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "tests"]
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
