[project]
name = "fusion-lab"
version = "0.1.0"
description = "Audio-text cross-attention fusion for intent classification"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "tensorboard>=2.16",
]

[dependency-groups]
dev = ["mypy>=1.10", "types-PyYAML"]

[tool.uv]
package = false

# CPU-only torch on linux keeps the docker image small
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
ignore_missing_imports = true
