data:
  path: data/
  train_file: train_data.csv
  valid_file: valid_data.csv
  test_file: test_data.csv
  wavs_location: data/
out_dir: results/
model_name: model.pt
modality: fusion  # fusion | text | audio
seed: 0
optimizer:
  lr: 0.0001
  beta1: 0.9
  beta2: 0.999
epochs: 10
batch_size: 100
max_len: 5000
audio_split_samples: 1000
hid_dim: 256
audio_layers: 3
text_layers: 2
cross_layers: 2
n_heads: 8
ff_dim: 512
dropout: 0.2
clip: 1.0
loss_mode: weighted_loss  # weighted_loss | mean
